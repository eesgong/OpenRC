[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenRC"
version = "0.1.0"
description = "Open Region Computation Library - steady-state security regions for power networks"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eesgong" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # pandas 3 is not supported yet; pandapower itself requires pandas 2.
    "pandas>=2.0,<3",
    "pandapower>=2.13",
    "pyomo>=6.6",
    # Process RSS monitoring for memory_limit_mb / --memory-limit-mb.
    "psutil>=5.9",
]

[project.optional-dependencies]
# Optional conic and global solvers for socp, exact, and DistFlow backend="solver".
mosek = ["mosek>=10.0"]
gurobi = ["gurobipy>=10.0"]
viz = ["matplotlib>=3.7"]
resources = ["psutil>=5.9"]
dev = [
    "matplotlib>=3.7",
    "psutil>=5.9",
    "ruff>=0.9",
    "mypy>=1.10",
    # Development tooling requires Python 3.11+; the runtime supports 3.9+.
    # Type information for `python -m mypy OpenRC`.
    "scipy-stubs>=1.16",
    "pandas-stubs>=2.0",
    "types-psutil",
]

[tool.setuptools.packages.find]
include = ["OpenRC", "OpenRC.*"]

[tool.setuptools.package-data]
OpenRC = ["py.typed", "cases/data/*/*.csv", "cases/data/*/*.json"]

[tool.ruff.lint]
# Syntax errors, undefined or unused names, and import hygiene.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# python -m mypy OpenRC
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Third-party packages without distributed type stubs.
[[tool.mypy.overrides]]
module = ["pandapower", "pandapower.*", "pyomo", "pyomo.*", "mosek", "mosek.*",
          "gurobipy", "gurobipy.*", "mpl_toolkits.*"]
ignore_missing_imports = true
